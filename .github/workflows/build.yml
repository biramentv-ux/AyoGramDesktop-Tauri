name: Build and Release dyrakDGram

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: ""
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-windows:
    name: Windows Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows portable
        run: |
          cd src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc
        shell: bash
      
      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-windows-portable
          path: src-tauri/target/release/bundle/ntx/dyrakDGram_*.exe
          
  build-macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Build macOS release
        run: |
          cd src-tauri
          cargo tauri build --target aarch64-apple-darwin
          cargo tauri build --target x86_64-apple-darwin
        shell: bash
        
      - name: Create universal binary
        run: |
          cd src-tauri/target/release/bundle/macos
          lipo -create dyrakDGram.app/Contents/MacOS/dyrakDGram -output dyrakDGram-universal
        
      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-macos
          path: src-tauri/target/release/bundle/macos/*.app
          
  build-linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.0-dev build-essential curl file libxdo-dev libasound2-dev libgtk-3-dev libdbus-glib-1-dev libhbrew-dev
        shell: bash
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Linux release
        run: |
          cd src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu
        shell: bash
        
      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dyrakDGram-windows-portable
          path: ./artifacts
      
      - name: Upload Windows portable to release
        uses: xresloader/upload-to-github-release@v1
        with:
          release_name: "dyrakDGram v${{ github.sha }}"
          file: ./artifacts/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
