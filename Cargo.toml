[package]
name = "dyrak-dgram"
version = "1.0.0"
description = "dyrakDGram - Telegram Desktop with advanced plugins and SpotyDown integration"
authors = ["Dyrak"]
license = "MIT"
repository = "https://github.com/dyrakdev/dyrakDGram"

[lib]
name = "dyrak_dgram_lib"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "1.8", features = ["api-all", "system-tray", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tauri-build = { version = "1.8" }

[features]
default = ["custom-protocol"]
custom-protocol = []



