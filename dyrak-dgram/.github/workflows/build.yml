name: dyrakDGram Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C link-arg=-s"
  NODE_ENV: production

jobs:
  build-desktop:
    name: Build Desktop (Windows/macOS/Linux)
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy, rust-analyzer
          
      - name: Install dependencies
        run: |
          npm install
          cargo install tauri-cli
        
      - name: Build desktop application
        run: |
          cd src-tauri
          cargo tauri build
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-${{ matrix.os }}-build
          path: |
            src-tauri/target/bundle/**/*
            !src-tauri/target/bundle/*.tar.gz
            !src-tauri/target/bundle/*.deb
          if-no-files-found: warn

  build-mobile:
    name: Build Mobile (Android/iOS)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm install
          cargo install tauri-cli
          
      - name: Build Android app
        run: |
          cargo tauri android build --release
          
      - name: Build iOS app
        run: |
          cargo tauri ios build --release
          
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/dyrak-dgram*
            !dist/**/*.deb
            !dist/**/Linux*.desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          npm install
          npm run build
          cp -r web/dist/* .
          echo "<meta http-equiv='refresh' content='0; url=https://dyrakdgram.github.io/dyrakDGram/'>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
