name: CI/CD Pipeline - dyrakDGram

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'mobile/**'
  pull_request:
    branches:
      - main

jobs:
  # Desktop build jobs
  build-desktop-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxcb-randr0-dev libxdo-dev libxtst-dev libcairo2-dev libpango1.0-dev libfreetype-dev libfontconfig1-dev
      - name: Build app
        run: |
          cd src-tauri
          cargo build --release
      - name: Build Tauri app
        run: |
          npm ci
          npm run tauri build

  build-desktop-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri app
        run: |
          npm ci
          npm run tauri build

  build-desktop-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          brew install llvm
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri app
        run: |
          npm ci
          npm run tauri build

  # Mobile build jobs
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev
      - name: Build Android app
        run: |
          npm ci
          npm run tauri android build

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          brew install llvm
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build iOS app
        run: |
          npm ci
          npm run tauri ios build

  # Web deployment job
  deploy-web:
    name: Deploy to GitHub Pages
    needs: [build-desktop-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true

  # Release job
  release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: actions/create-release@v4
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
