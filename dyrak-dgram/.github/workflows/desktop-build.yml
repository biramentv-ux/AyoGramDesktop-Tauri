name: Build Desktop Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build dyrakDGram Desktop
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev             libayatana-appindicator3-dev             librsvg2-dev             pkg-config             cmake
      
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install webkitgtk
      
      - name: Build desktop application
        run: |
          cd dyrak-dgram
          cargo build --release
          cd src-tauri
          tauri build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-${{ matrix.os }}-desktop
          path: |
            src-tauri/target/release/bundle/**
            !src-tauri/target/release/bundle/**/*.debug
