name: Build Mobile Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build dyrakDGram Mobile
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Android SDK
        uses: rtCamp/action-android-sdk@latest
        with:
          sdk-path: android/sdk
      
      - name: Install mobile dependencies
        run: |
          cd dyrak-dgram
          cargo build --target aarch64-linux-android --release
          cargo build --target i686-linux-android --release
          cargo build --target x86_64-linux-android --release
      
      - name: Build Android APK
        uses: tauri-apps/tauri-action@v4
        with:
          tauri-cli: "2.0"
          args: -- --target aarch64-linux-android
      
      - name: Build iOS App
        uses: tauri-apps/tauri-action@v4
        with:
          tauri-cli: "2.0"
          args: -- --target aarch64-apple-ios
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dyrakDGram-mobile
          path: |
            src-tauri/target/**/bundle/**
            !src-tauri/target/**/bundle/**/*.debug
