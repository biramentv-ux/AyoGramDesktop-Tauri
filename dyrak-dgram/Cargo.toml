[package]
name = "dyrak-dgram"
version = "2.0.0"
description = "A Tauri application with mobile support"
authors = ["Dyragram Team"]
edition = "2021"

[lib]
name = "dyragram_lib"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = ["custom-window"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-window"]
custom-window = ["tauri/custom-window"]

[build-dependencies]
tauri-build = { version = "2.0" }
