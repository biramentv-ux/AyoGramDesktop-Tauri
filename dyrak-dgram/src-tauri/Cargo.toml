[package]
name = "dyragram"
version = "2.0.0"
description = "dyrakDGram - Telegram Client with Plugins"
authors = ["dyragDev"]
license = "MIT"
repository = "https://github.com/dyragram/dyGRAM"
default-run = "dyragram"

[dependencies]
tauri = { version = "2.0", features = ["api-all", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"

[build-dependencies]
tauri-build = { version = "2.0" }

[features]
default = ["tauri/default"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "dyragram"
version = "2.0.0"
description = "dyrakDGram - Telegram Client Mobile"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
