[package]
name = "dyrak-dgram"
version = "1.0.0"
description = "A custom Telegram fork desktop application with Bulgarian support"
authors = ["dyrakDGram"]
edition = "2021"

[lib]
name = "dyrak_dgram_lib"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tauri-build = { version = "1.5" }
