[package]
name = "spotydown"
version = "1.0.0"
edition = "2021"
description = "Spotify music downloader plugin for dyrakDGram"

[dependencies]
serde_json = "1.0"
tauri = { version = "2", features = ["api_all"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
url = "2.5"
