[package]
name = "dyrak-dgram"
version = "1.0.0"
description = "Telegram-based desktop client with premium features and Spotify integration"
authors = ["Dyrak"]
license = "MIT"
repository = "https://github.com/dyrakdev/dyrakDGram"
default-run = "dyrak-dgram"

[dependencies]
tauri = { version = "1.8", features = ["api-all", "system-tray", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "1.6", features = ["json", "rustls-tls"] }

[build-dependencies]
tauri-build = "1.8"

[features]
default = ["tauri/default"]
product-icons = ["tauri/product-icons"]
development = ["tauri/development"]
