[package]
name = "dyrak-dgram"
version = "1.0.0"
description = "dyrakDGram - Telegram Desktop with advanced plugins and SpotyDown integration"
authors = ["Dyrak"]
license = "MIT"
repository = "https://github.com/dyrakdev/dyrakDGram"

[lib]
name = "dyrak_dgram_lib"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "1.8", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tauri-build = "1.5"

[features]
default = ["custom-protocol"]
custom-protocol = []

[workspace]
members = [
  "src-tauri",
  "src-tauri/plugins/spotydown"
]

[[bin]]
name = "dyrak-dgram"
path = "src-tauri/src/main.rs"
