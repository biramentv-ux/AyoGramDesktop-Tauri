[package]
name = "ayogram_desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = "1"

[features]
default = ["custom-protocol"]
custom-protocol = []

[dependencies]
tauri = { version = "1.8", features = ["system-tray", "tray-icon"] }
ghost_mode = { path = "../ghost_mode" }
stream_mode = { path = "../stream_mode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["../ghost_mode", "../stream_mode"]

[package.metadata.tauri.build]
before_build_command = "pnpm build"

[[bin]]
name = "ayogram_desktop"
path = "src/main.rs"
