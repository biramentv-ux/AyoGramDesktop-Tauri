[package]
name = "dy-rak-spotydown"
version = "1.0.0"
description = "A Spotify integration plugin for Telegram Premium features"
authors = ["Dyrak"]
edition = "2021"

[lib]
name = "dy_rak_spotydown"
path = "src/lib.rs"

[dependencies]
tauri = { version = "1.8", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "1.6", features = ["json", "rustls-tls"] }
tokio = { version = "1.37", features = ["full"] }

[build-dependencies]
tauri-build = "1.8"
