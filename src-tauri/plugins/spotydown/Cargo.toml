[package]
name = "dyrak_spotydown"
version = "1.0.0"
description = "Spotify music downloader plugin for dyrakDGram"
authors = ["Dyrak"]
edition = "2021"

[lib]
name = "dyrak_spotydown"
path = "../src/spotydown.rs"

[dependencies]
tauri = { version = "1.8", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
lyrically = "0.3"
ffmpeg-normalize = "0.2"

[build-dependencies]
tauri-build = "1.5"
