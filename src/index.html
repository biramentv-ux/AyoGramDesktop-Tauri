<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AyoGram Desktop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-sky-400 mb-6">AyoGram Desktop Hybrid</h1>
    
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-neutral-900 rounded-2xl p-6 shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Ghost Mode</h2>
        <pre id="ghost" class="bg-black/40 p-4 rounded-lg text-sm overflow-auto"></pre>
        <div class="mt-4 flex gap-2">
          <button onclick="toggleGhost('invisible_typing')" class="px-4 py-2 bg-sky-600 rounded-lg hover:bg-sky-500">Toggle Typing</button>
          <button onclick="toggleGhost('hide_read_receipts')" class="px-4 py-2 bg-sky-600 rounded-lg hover:bg-sky-500">Toggle Receipts</button>
        </div>
      </div>

      <div class="bg-neutral-900 rounded-2xl p-6 shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Stream Mode</h2>
        <pre id="stream" class="bg-black/40 p-4 rounded-lg text-sm overflow-auto"></pre>
        <div class="mt-4 flex gap-2">
          <button onclick="toggleStream()" class="px-4 py-2 bg-emerald-600 rounded-lg hover:bg-emerald-500">Toggle Stream</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function refresh() {
      try {
        const ghost = await window.__TAURI__?.invoke('get_ghost_mode') ?? {invisible_typing:false, hide_read_receipts:false};
        document.getElementById('ghost').textContent = JSON.stringify(ghost, null, 2);
        const stream = await window.__TAURI__?.invoke('get_stream_mode') ?? {enabled:false, quality:'720p'};
        document.getElementById('stream').textContent = JSON.stringify(stream, null, 2);
      } catch(e){}
    }
    async function toggleGhost(key){
      await window.__TAURI__?.invoke('toggle_ghost_mode', { key });
      refresh();
    }
    async function toggleStream(){
      await window.__TAURI__?.invoke('toggle_stream_mode');
      refresh();
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
